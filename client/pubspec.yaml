name: brain_think
description: "brain-think (头脑风暴) — app_plat OAuth + 脑池 API 端到端验证客户端"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.5.1

  # 路由
  go_router: ^14.6.1

  # 网络
  dio: ^5.7.0

  # 内嵌 WebView（OAuth 授权登录）
  flutter_inappwebview: ^6.1.5

  # 安全存储 sessionToken
  flutter_secure_storage: ^9.2.2

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
